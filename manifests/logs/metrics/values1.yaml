region: eu-west-1
clusterName: mntr
k8sMode: K8S
containerLogs:
  enabled: true
  fluentBit:
    image:
      repository: aws-for-fluent-bit
      tag: 2.32.0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    config:
      service: |
        [SERVICE]
            Daemon    Off
            Flush     1
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020
            Health_Check  On
            storage.path /var/fluent-bit/state
      customParsers: |
        [PARSER]
            Name cri
            Format cri

kubeletConfig:
  insecureSkipVerify: true

agent:
  mode: daemonset
  image:
    repository: cloudwatch-agent
    tag: 1.300063.0b1323
  enabled: true

agents:
  - name: cloudwatch-agent

agent:
  mode: daemonset
  image:
    repository: cloudwatch-agent
    tag: 1.300044.0
  enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  env: []
  serviceAccount:
    create: true
  config: {}

  defaultConfig:
    {
      "logs": {
        "metrics_collected": {
          "kubernetes": {
            "cluster_name": "mntr",
            "metrics_collection_interval": 60,
            "enhanced_container_insights": false
          }
        },
        "force_flush_interval": 5
      }
    }

prometheus:
  config: {}
  targetAllocator:
    enabled: false

dcgmExporter:
  enabled: false

neuronMonitor:
  enabled: false