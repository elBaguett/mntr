# Это КЛЮЧЕВОЙ параметр для логики чарта, чтобы он не упал при проверке Kubelet
kubeletConfig:
  insecureSkipVerify: true

prometheus:
  enabled: false
dcgmExporter:
  enabled: false
neuronMonitor:
  enabled: false
