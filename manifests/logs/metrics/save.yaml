region: eu-west-1
clusterName: mntr
k8sMode: K8S

containerLogs:
  enabled: true
  fluentBit:
    image:
      repository: aws-for-fluent-bit
      tag: latest
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    config:
      service: |
        [SERVICE]
            Daemon    Off
            Flush     1
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020
            Health_Check  On
            storage.path /var/fluent-bit/state

        [FILTER]
            Name                kubernetes
            Match               kube.*
            Kube_URL            https://kubernetes.default.svc:443
            tls.verify          Off
            Merge_Log           On
      customParsers: |
        [PARSER]
            Name cri
            Format cri

agent:
  enabled: true
  mode: daemonset
  image:
    repository: cloudwatch-agent
    tag: latest
  customConfig:
    receivers:
      awscontainerinsightreceiver:
        # Убираем проверку сертификатов Kubelet
        insecure_skip_verify: true
        endpoint: "https://$(HOST_IP):10250"
        add_full_pod_name_metric_label: true
        add_container_name_metric_label: true
    exporters:
      awsemf:
        region: "eu-west-1"
        log_group_name: "/aws/containerinsights/mntr/performance"
        log_stream_name: "{NodeName}"
    service:
      pipelines:
        metrics:
          receivers: [awscontainerinsightreceiver]
          exporters: [awsemf]  
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  serviceAccount:
    create: true

