apiVersion: v1
kind: ConfigMap
metadata:
  name: cwagentconfig
  namespace: amazon-cloudwatch
data:
  cwagentconfig.json: |
    {
      "agent": {
        "region": "eu-west-1",
        "metrics_collection_interval": 60
      },
      "metrics": {
        "append_dimensions": {
          "InstanceId": "${aws:InstanceId}"
        },
        "metrics_collected": {
          "cpu": {
            "resources": [
              "*"
            ],
            "measurement": [
              "cpu_usage_idle",
              "cpu_usage_iowait",
              "cpu_usage_user",
              "cpu_usage_system"
            ]
          },
          "mem": {
            "measurement": [
              "mem_used_percent"
            ]
          },
          "disk": {
            "resources": [
              "*"
            ],
            "measurement": [
              "used_percent"
            ]
          }
        }
      }
    }