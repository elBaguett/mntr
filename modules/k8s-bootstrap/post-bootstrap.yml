---
- hosts: master2
  become: yes
  vars:
    kube_user: "ubuntu"
    home_dir: "/home/ubuntu"
    kubeconfig: "/etc/kubernetes/admin.conf"
    calicoctl_version: "v3.31.4"
    calico_operator_version: "v3.29.0"
    allow_policy: "{{ home_dir }}/code/calico/allow-all.yml"
    aws_region: "{{ 'eu-west-1' if ansible_host is search('^10\\.20\\.') else 'us-east-1' }}"
    log_group_tmpl: "/k8s/app/\\$kubernetes['namespace_name']"

  tasks:

    - name: Download calicoctl binary
      get_url:
        url: "https://github.com/projectcalico/calico/releases/download/{{ calicoctl_version }}/calicoctl-linux-amd64"
        dest: "{{ home_dir }}/calicoctl"
        mode: '0755'
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"

    - name: Install calicoctl system-wide
      copy:
        src: "{{ home_dir }}/calicoctl"
        dest: /usr/local/bin/calicoctl
        mode: '0755'
        owner: root
        group: root
        remote_src: yes

    - name: Create namespace mntr
      command: |
          kubectl --kubeconfig=/etc/kubernetes/admin.conf create namespace mntr

    - name: Create namespace eu
      command: |
          kubectl --kubeconfig=/etc/kubernetes/admin.conf create namespace amazon-cloudwatch-eu

    - name: Create namespace us
      command: |
          kubectl --kubeconfig=/etc/kubernetes/admin.conf create namespace amazon-cloudwatch-us

    - name: Create roles for each env
      command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f \
              {{ home_dir }}/code/logs/metrics/k8s_res

    - name: Label K8s nodes with correct region
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/admin.conf label node {{ item.node }} node-region={{ item.region }} --overwrite
      loop:
        - { node: "ip-10-10-10-11",  region: "eu-west-1" }
        - { node: "ip-10-10-20-14",  region: "eu-west-1" }
        - { node: "ip-10-10-20-11",  region: "eu-west-1" }
        - { node: "ip-10-20-10-10",  region: "us-east-1" }
        - { node: "ip-10-20-20-10",  region: "us-east-1" }
        - { node: "ip-10-20-20-12",  region: "us-east-1" }

    - name: Create secret etcd-certs
      command: sudo kubectl -n mntr --kubeconfig=/etc/kubernetes/admin.conf create secret generic etcd-certs --from-file=ca.crt=/etc/kubernetes/pki/etcd/ca.crt --from-file=server.crt=/etc/kubernetes/pki/etcd/server.crt --from-file=server.key=/etc/kubernetes/pki/etcd/server.key

    - name: Apply Calico CRDs
      command: kubectl apply --kubeconfig=/etc/kubernetes/admin.conf -f https://docs.projectcalico.org/manifests/crds.yaml --kubeconfig={{ kubeconfig }}

    - name: Apply Calico operator CRDs
      command: kubectl apply --kubeconfig=/etc/kubernetes/admin.conf --server-side --force-conflicts -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_operator_version }}/manifests/operator-crds.yaml --kubeconfig={{ kubeconfig }}

    - name: Apply allow-all Calico policy
      command: calicoctl apply -f {{ allow_policy }} --allow-version-mismatch
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      when: allow_policy is file

    - name: Install Helm3 
      become_user: "{{ kube_user }}"
      shell: curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
      args:
        creates: "{{ home_dir }}/.local/bin/helm"

    - name: Add ingress-nginx repository
      become_user: "{{ kube_user }}"
      shell: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true

    - name: Update Helm repositories
      become_user: "{{ kube_user }}"
      shell: helm repo update

    - name: Deploy ingress-nginx via Helm
      become_user: "{{ kube_user }}"
      shell: |
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --namespace ingress-nginx --create-namespace

    - name: Add aws-observability Helm repository
      become_user: "{{ kube_user }}"
      shell: |
        helm repo add aws-observability https://aws-observability.github.io/helm-charts || true

    - name: Update Helm repositories for fluent-bit
      become_user: "{{ kube_user }}"
      shell: helm repo update

    - name: Render CloudWatch values.yaml for eu-west-1
      become_user: "{{ kube_user }}"
      template:
        src: "../../manifests/logs/metrics/cloudwatch-values.yaml.j2"
        dest: "{{ home_dir }}/code/logs/metrics/values-{{ inventory_hostname }}-eu-west.yaml"
      vars:
        kubelet_endpoint: "https://{{ ansible_facts['hostname'] }}:10250"
        node_region: "eu-west-1"
        node_name: "{{ inventory_hostname }}"

    - name: Render CloudWatch values.yaml for us-east-1
      become_user: "{{ kube_user }}"
      template:
        src: "../../manifests/logs/metrics/cloudwatch-values.yaml.j2"
        dest: "{{ home_dir }}/code/logs/metrics/values-{{ inventory_hostname }}-us-east.yaml"
      vars:
        kubelet_endpoint: "https://{{ ansible_facts['hostname'] }}:10250"
        node_region: "us-east-1"
        node_name: "{{ inventory_hostname }}"

    - name: Install CloudWatch agent for eu-west-1
      become_user: "{{ kube_user }}"
      shell: |
        helm upgrade --install amazon-cloudwatch-observability-eu-west \
          {{ home_dir }}/code/logs/metrics/amazon-cloudwatch-observability \
          --namespace amazon-cloudwatch-eu \
          --set agent.createClusterRole=false \
          -f {{ home_dir }}/code/logs/metrics/values-{{ inventory_hostname }}-eu-west.yaml  || true
    
    - name: Install CloudWatch agent for us-east-1
      become_user: "{{ kube_user }}"
      shell: |
        helm upgrade --install amazon-cloudwatch-observability-us-east \
          {{ home_dir }}/code/logs/metrics/amazon-cloudwatch-observability \
          --namespace amazon-cloudwatch-us \
          --set agent.createClusterRole=false \
          -f {{ home_dir }}/code/logs/metrics/values-{{ inventory_hostname }}-us-east.yaml || true

    - name: Wait for argocd-initial-admin-secret
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n argocd get secret argocd-initial-admin-secret --no-headers
      register: argo_secret_ready
      retries: 20
      delay: 15
      until: argo_secret_ready.rc == 0

    - name: Show ArgoCD initial admin password
      shell: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_pw
      changed_when: false
      failed_when: false 

    - name: Ensure secrets directory exists
      file:
        path: secrets
        state: directory
        mode: "0750"
    
    - name: Save ArgoCD initial admin password to file
      copy:
        content: "{{ argocd_pw.stdout }}"
        dest: secrets/argocd-admin-password.txt
        mode: "0600"

    - debug:
        msg: "ArgoCD initial admin password: {{ argocd_pw.stdout | default('not found') }}"